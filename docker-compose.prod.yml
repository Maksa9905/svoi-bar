services:
  backend:
    build: !reset null
    image: ghcr.io/${GHCR_OWNER}/svoi-backend:${IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: false

  frontend:
    build: !reset null
    image: ghcr.io/${GHCR_OWNER}/svoi-frontend:${IMAGE_TAG:-latest}

  admin:
    build: !reset null
    image: ghcr.io/${GHCR_OWNER}/svoi-admin:${IMAGE_TAG:-latest}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docker-entrypoint.sh:/entrypoint.sh:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./deploy/nginx/cors-map.conf:/etc/nginx/cors-map.conf:ro
      - ./deploy/nginx/api-cors.conf:/etc/nginx/api-cors.conf:ro
      - ./deploy/nginx/http.conf:/etc/nginx/templates-src/http.conf:ro
      - ./deploy/nginx/https.conf:/etc/nginx/templates-src/https.conf:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      - frontend
      - backend
      - admin
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200 & wait $$!; done"
    restart: unless-stopped

volumes:
  certbot_www:
  letsencrypt:
